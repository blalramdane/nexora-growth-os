name: CRM POC tests

on:
  push:
    paths:
      - "integrations/crm/**"
      - ".github/workflows/crm-poc-tests.yml"
  pull_request:
    paths:
      - "integrations/crm/**"
      - ".github/workflows/crm-poc-tests.yml"
  workflow_dispatch:

jobs:
  importer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install XLSX reader dependency
        run: python -m pip install --upgrade pip openpyxl
      - name: Run importer tests
        working-directory: integrations/crm
        run: python -m unittest -v
